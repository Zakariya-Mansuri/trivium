# Render Blueprint — deploys the Trivium API + PostgreSQL.
# In the Render dashboard: New > Blueprint > point at this repo.
# After the first deploy, set CORS_ORIGINS to your real Vercel URL.
services:
  - type: web
    name: trivium-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trivium-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://trivium.vercel.app # <- replace with your Vercel frontend URL
      - key: LLM_PROVIDER
        value: mock # set to groq/openai/anthropic + add LLM_API_KEY for a real model
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: ""

databases:
  - name: trivium-db
    plan: free
